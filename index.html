<!DOCTYPE html>
<html>
<head>
  <title>My Cool Website</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #4facfe, #00f2fe);
      color: white;
      text-align: center;
    }

    .container {
      padding: 100px 20px;
    }

    h1 {
      font-size: 50px;
    }

    p {
      font-size: 20px;
    }

    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 25px;
      background: white;
      color: #333;
      text-decoration: none;
      border-radius: 25px;
      font-weight: bold;
    }

    .btn:hover {
      background: #ddd;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Welcome 👋</h1>
    <p>This is my first cool website!</p>
    <a class="btn" href="#">Learn More</a>
    <a href="https://google.com">Go to Google</a>
  </div>

</body>
</html>
